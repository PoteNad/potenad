name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: ./scripts/check.sh

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/PoteNad-$VERSION-macOS.zip" \
            "dist/PoteNad-$VERSION-macOS.zip.sha256" \
            "dist/PoteNad-macOS.zip" \
            "dist/PoteNad-$VERSION-macOS.dmg" \
            "dist/PoteNad-$VERSION-macOS.dmg.sha256" \
            "dist/PoteNad-macOS.dmg" \
            --generate-notes \
            --title "PoteNad $VERSION"
